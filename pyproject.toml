[project]
name = "pulso-ai"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/pulso"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
